version: "3.9"

services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aml_simulator
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - NUM_CUSTOMERS=${NUM_CUSTOMERS:-2000}
      - NUM_TRANSACTIONS=${NUM_TRANSACTIONS:-20000}
      - ILLICIT_RATIO=${ILLICIT_RATIO:-0.05}
      - RANDOM_SEED=${RANDOM_SEED:-42}
      - NUM_WORKERS=${NUM_WORKERS:-4}
      - DATA_DIR=/app/data/output
      - RESULTS_DIR=/app/data/results
    command: python scripts/run_simulation.py

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aml_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - DATA_DIR=/app/data/output
      - RESULTS_DIR=/app/data/results
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - simulator

  frontend:
    image: node:20-alpine
    container_name: aml_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - api
