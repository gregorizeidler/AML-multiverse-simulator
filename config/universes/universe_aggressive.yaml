id: universe_aggressive
name: "Aggressive AML Strategy"
description: >
  High thresholds and strong signal requirements. Very few false positives
  but misses more laundering activity. Suitable for low-risk environments.

rules:
  - id: R001
    name: large_single_transaction
    field: amount
    operator: ">"
    threshold: 25000
    weight: 1.0
    alert_level: medium
    typologies: [structuring]

  - id: R002
    name: rapid_succession_transactions
    field: tx_count_1h
    operator: ">"
    threshold: 10
    weight: 2.0
    alert_level: high
    typologies: [smurfing]

  - id: R003
    name: velocity_24h
    field: amount_24h
    operator: ">"
    threshold: 40000
    weight: 1.5
    alert_level: high
    typologies: [structuring]

  - id: R004
    name: unusual_counterparty_count
    field: unique_counterparties_7d
    operator: ">"
    threshold: 20
    weight: 1.2
    alert_level: medium
    typologies: [layering]

  - id: R006
    name: cross_border_transaction
    field: is_cross_border
    operator: "=="
    threshold: 1
    weight: 0.5
    alert_level: low
    typologies: [round_tripping]

  - id: R008
    name: graph_centrality_high
    field: betweenness_centrality
    operator: ">"
    threshold: 0.20
    weight: 2.5
    alert_level: high
    typologies: [layering, round_tripping]

  - id: R009
    name: amount_deviation_from_mean
    field: amount_zscore
    operator: ">"
    threshold: 8.0
    weight: 2.0
    alert_level: high
    typologies: [smurfing, structuring]

scoring:
  method: weighted_sum
  alert_threshold: 4.0
  high_risk_threshold: 7.0

cost_model:
  investigation_cost_per_alert: 150
  missed_laundering_cost_per_txn: 50000
